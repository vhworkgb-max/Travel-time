<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Time</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header>
            <h1>Travel Time</h1>
            <div class="weather">
                <img src="weather.jpg" alt="weather">
                <span>22°</span>
            </div>
        </header>
        <div class="card">
            <h3>Тустань + Сколівські Бескиди</h3>
            <img src="tustan.jpg" alt="Карпати" class="photopidkova">
            <h4>Загальна відстань: 220–250 км</h4>
            <h4>Час: 10–12 годин</h4>
            <ul>
                <li>Тустань</li>
                <li>Водоспад Кам'янка</li>
                <li>Журавлине озеро</li>
            </ul>
            <h4>Плюси:</h4>
            <h4>Мінімум музеїв, максимум природи.
            Підійде для легкого трекінгу.
            Дуже красиві краєвиди Карпат.</h4>
            
            <a href="https://www.google.com/maps/dir/?api=1&origin=My+Location&destination=Журавлине+озеро&waypoints=Тустань|Водоспад+Кам'янка" target="_blank" class="route-btn">
   🚗 Прокласти маршрут у Google Maps
</a>
        </div>
</body>
</html>
